<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KOVO · Administración de la plataforma</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="stylesheet" href="/src/fonts.css">
<style>
:root{--bg:#F3F5F4;--surface:#FFFFFF;--line:#E3E7E5;--line-2:#D0D6D3;--fg:#0A0C0B;--muted:#5B6560;--accent:#1F5E46;--accent-ink:#1A5340;--accent-soft:#E2EEE8;
  --ok-ink:#17694A;--ok-soft:#E2F2EB;--warn-ink:#8A5B08;--warn-soft:#FBF0D9;--bad:#C44536;--bad-ink:#A32E21;--bad-soft:#FBE7E4;
  --f:"Geist","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--f-mono:"Geist Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f)}
header.top{background:#0A0C0B;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top b{letter-spacing:.2em;font-weight:600}header.top .tag{font-size:.75rem;padding:2px 8px;border-radius:999px;background:#C44536}
header.top .sp{flex:1}header.top button{background:transparent;color:#fff;border:1px solid #444;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.35rem;margin:0 0 4px}h2{font-size:1.05rem;margin:0}
.muted{color:var(--muted)}.small{font-size:.8125rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0}
.panel header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.8125rem}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;white-space:nowrap}td.r,th.r{text-align:right}
.chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.75rem;background:#E5E9E7}
.chip.ok{background:var(--ok-soft);color:var(--ok-ink)}.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}.chip.bad{background:var(--bad-soft);color:var(--bad-ink)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:.8125rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--bad-ink);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.card{max-width:420px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px}
form{display:grid;gap:12px}label{display:grid;gap:4px;font-size:.8125rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.msg{border-radius:8px;padding:8px 12px;font-size:.8125rem;background:var(--bad-soft);color:var(--bad-ink)}.msg.ok{background:var(--ok-soft);color:var(--ok-ink)}
dialog{border:1px solid var(--line);border-radius:14px;padding:20px;max-width:440px;width:calc(100% - 32px)}dialog::backdrop{background:rgba(10,12,11,.45)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0A0C0B;color:#fff;padding:10px 16px;border-radius:10px;font-size:.8125rem;max-width:calc(100% - 32px)}
</style></head>
<body>
<header class="top"><b>KOVO</b><span class="tag">Plataforma · uso interno</span><span class="sp"></span><span id="who" class="small"></span><button id="out" hidden>Cerrar sesión</button></header>
<main id="app"><p class="muted">Cargando…</p></main>
<div id="toast" hidden role="status"></div>
<script type="module" src="/src/admin.js"></script>
</body></html>
